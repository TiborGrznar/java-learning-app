spring:
  application:
    name: backend
  profiles:
    active: dev

server:
  port: 8080

app:
  jwt:
    # Base64-encoded HMAC key, at least 256 bits. Required, no default on purpose.
    secret: ${JWT_SECRET}
    access-token-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TTL:7d}
  quiz:
    # Share of correct answers (in percent) needed to pass a quiz.
    pass-threshold-percent: ${QUIZ_PASS_THRESHOLD_PERCENT:70}
    # Number of questions drawn from a module's question bank for one attempt.
    questions-per-attempt: ${QUIZ_QUESTIONS_PER_ATTEMPT:10}
    # How long a loaded quiz can be submitted before it has to be loaded again.
    token-ttl: ${QUIZ_TOKEN_TTL:2h}
  admin:
    # First administrator, created at startup only when no administrator exists yet.
    # Both ADMIN_EMAIL and ADMIN_PASSWORD must be set together (password: min 12 characters).
    # Remove ADMIN_PASSWORD from the environment after the first start.
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    name: ${ADMIN_NAME:}
    surname: ${ADMIN_SURNAME:}
  rate-limit:
    # Per client IP, evaluated before authentication.
    login-per-ip: { max: 10, window: 15m }
    register-per-ip: { max: 5, window: 1h }
    refresh-per-ip: { max: 30, window: 1m }
    # Every other request under /api/v1/. A school behind one address shares this budget.
    api-per-ip: { max: 600, window: 1m }
    # Failed logins per e-mail, whatever the IP.
    login-failures-per-email: { max: 5, window: 15m }
    # Quiz loads per student.
    quiz-load-per-user: { max: 20, window: 1m }
    # Upper bound of tracked keys per limiter, protects memory against forged keys.
    max-tracked-keys: 10000
    # Exact addresses of reverse proxies whose X-Forwarded-For is believed (comma separated). Empty = never.
    trusted-proxies: ${RATE_LIMIT_TRUSTED_PROXIES:}
    max-body-bytes: 16384
    large-body-bytes: 1048576
    large-body-prefixes:
      - /api/v1/modules

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:mysql://localhost:${DB_PORT:3306}/${DB_NAME:java_learning_app}
    username: ${DB_USER:jla_app}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true

---
spring:
  config:
    activate:
      on-profile: test

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false