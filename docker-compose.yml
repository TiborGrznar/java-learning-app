services:
  mysql:
    image: mysql:8.0
    container_name: jla-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-java_learning_app}
      MYSQL_USER: ${DB_USER:-jla_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    ports:
      # Bound to localhost only: the database must not be reachable from other machines on the network.
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data: