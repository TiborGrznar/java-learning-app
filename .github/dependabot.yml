version: 2

updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One PR for routine minor and patch bumps instead of one per library.
      maven-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: maven
    directory: /runner
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Same idea as for the backend. Two entries, so Spring Boot is bumped in two PRs that
      # are merged together to keep both modules on the same version.
      runner-maven-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        update-types: [minor, patch]
    commit-message:
      # Actions are pinned to commit SHAs with the version in a trailing comment. Dependabot
      # updates both the SHA and the comment.
      prefix: "chore(ci)"

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    ignore:
      # Stay on the MySQL 8.4 LTS line. A new major version (9.x, 26.x) is a project decision
      # (open-decisions.md) and must be changed together with the Testcontainers image.
      - dependency-name: mysql
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: docker
    # Base image of the code sandbox (FROM line, pinned to a digest).
    directory: /runner/sandbox
    schedule:
      interval: weekly
      day: monday
    ignore:
      # Stay on Java 25 (LTS). A new Java major version is a project decision and changes
      # the compiler the students' code is judged with.
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
