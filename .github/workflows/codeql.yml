name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly run catches new queries even when the code did not change (Monday 04:17 UTC).
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # "actions" scans our own workflow files for injection and permission mistakes.
        # Add javascript-typescript here when the frontend exists.
        language: [java-kotlin, actions]

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # No build needed: the analysis reads the sources directly. This avoids having
          # to keep a Java 25 toolchain working inside the scanner.
          build-mode: none
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}