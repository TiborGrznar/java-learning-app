name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: java_learning_app
          MYSQL_USER: jla_app
          MYSQL_PASSWORD: ci-app-password
        ports:
          - 3306:3306
        # -h 127.0.0.1 forces TCP: during first start the image runs a temporary server
        # without networking, which would make a socket ping report "healthy" too early.
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_NAME: java_learning_app
      DB_USER: jla_app
      DB_PASSWORD: ci-app-password
      DB_PORT: 3306

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Generate a throwaway JWT secret
        run: echo "JWT_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Build and test
        working-directory: backend
        run: sh ./mvnw -B -ntp verify