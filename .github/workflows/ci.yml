name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Newer pushes cancel older runs of the same branch or PR, but every run on main is kept.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # The integration tests start their own MySQL container with Testcontainers (Docker is
      # preinstalled on the runner) and use a test-only JWT secret from src/test/resources,
      # so no database service or secrets are needed here.
      - name: Build and test
        working-directory: backend
        run: sh ./mvnw -B -ntp verify

  runner:
    name: Runner build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # The tests supply their own throwaway token. Docker is preinstalled on the runner for the
      # sandbox tests that arrive with the Docker integration.
      - name: Build and test
        working-directory: runner
        run: sh ./mvnw -B -ntp verify